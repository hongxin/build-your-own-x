<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com;">
    <title>Weather Clock</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23FFCC00'/></svg>">
    <style>
        /* =========================================
           Braun Design System
           Inspired by Dieter Rams — Less, but better
           ========================================= */
        :root {
            --bg: #FFFFFF;
            --surface: #F6F6F6;
            --text-primary: #1A1A1A;
            --text-secondary: #999999;
            --text-tertiary: #CCCCCC;
            --accent: #FFCC00;
            --divider: #EEEEEE;
            --border: #E0E0E0;
            --error: #C44;
            --shadow: rgba(0,0,0,0.06);
            --radius: 20px;
            --font: 'Helvetica Neue', -apple-system, BlinkMacSystemFont,
                     'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
        }

        /* Dark Theme — Premium Night Mode */
        [data-theme="dark"] {
            --bg: #0B0B0B;
            --surface: #151515;
            --text-primary: #E6E6E6;
            --text-secondary: #555555;
            --text-tertiary: #333333;
            --accent: #FFCC00;
            --divider: #1C1C1C;
            --border: #252525;
            --error: #E85555;
            --shadow: rgba(0,0,0,0.5);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.6s ease, color 0.5s ease;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            user-select: none;
        }

        /* =========================================
           Clock Face — Product Bezel
           ========================================= */
        .clock-face {
            width: 100%;
            max-width: 460px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 52px 44px 40px;
            text-align: center;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
            transition: border-color 0.6s ease, background-color 0.6s ease;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* =========================================
           Time Display
           ========================================= */
        .time-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            line-height: 1;
            margin-bottom: 10px;
        }

        .time-hm {
            font-size: 108px;
            font-weight: 100;
            letter-spacing: -4px;
            font-variant-numeric: tabular-nums;
        }

        .time-colon {
            transition: opacity 0.15s ease;
        }

        .time-colon.dim {
            opacity: 0.25;
        }

        .time-sec {
            font-size: 36px;
            font-weight: 200;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            margin-left: 6px;
            min-width: 50px;
            text-align: left;
        }

        /* =========================================
           Date Display
           ========================================= */
        .date-row {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 36px;
        }

        /* =========================================
           Accent Divider (Braun Yellow)
           ========================================= */
        .accent-line {
            height: 2px;
            background: var(--accent);
            margin: 0 auto 30px;
            width: 56px;
            border-radius: 1px;
            transition: width 0.4s ease, opacity 0.4s ease;
        }

        .accent-line.loading {
            width: 100px;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }

        /* =========================================
           Current Weather
           ========================================= */
        .weather-current {
            margin-bottom: 30px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .weather-hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .weather-icon {
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .weather-icon svg {
            display: block;
        }

        .weather-temp {
            font-size: 56px;
            font-weight: 100;
            line-height: 1;
            letter-spacing: -1px;
        }

        .weather-unit {
            font-size: 22px;
            font-weight: 300;
            color: var(--text-secondary);
            vertical-align: super;
        }

        .weather-desc {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .weather-meta {
            display: flex;
            justify-content: center;
            gap: 28px;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        /* =========================================
           Thin Divider
           ========================================= */
        .thin-line {
            height: 1px;
            background: var(--divider);
            margin: 0 auto 26px;
            width: 75%;
        }

        /* =========================================
           3-Day Forecast
           ========================================= */
        .forecast {
            display: flex;
            justify-content: center;
            gap: 36px;
            margin-bottom: 30px;
        }

        .forecast-day {
            text-align: center;
            min-width: 68px;
        }

        .forecast-name {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .forecast-icon {
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .forecast-icon svg {
            display: inline-block;
        }

        .forecast-temps {
            font-size: 14px;
            font-weight: 300;
        }

        .temp-hi {
            color: var(--text-primary);
        }

        .temp-lo {
            color: var(--text-tertiary);
            margin-left: 3px;
        }

        /* =========================================
           Location Bar
           ========================================= */
        .location-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 11px;
            color: var(--text-tertiary);
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .location-bar:hover {
            color: var(--text-secondary);
        }

        .loc-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* =========================================
           City Search
           ========================================= */
        .search-box {
            margin-top: 12px;
            position: relative;
            display: inline-block;
        }

        .search-input {
            width: 220px;
            border: none;
            border-bottom: 1.5px solid var(--divider);
            padding: 8px 2px;
            font-size: 14px;
            font-family: var(--font);
            text-align: center;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
            letter-spacing: 1px;
        }

        .search-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            background: var(--bg);
            border: 1px solid var(--divider);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 20px var(--shadow);
            z-index: 10;
        }

        .search-item {
            padding: 11px 18px;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: background 0.12s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-item:hover {
            background: var(--surface);
        }

        .search-city {
            color: var(--text-primary);
        }

        .search-region {
            color: var(--text-tertiary);
            font-size: 11px;
        }

        /* =========================================
           Status Messages
           ========================================= */
        .status {
            font-size: 13px;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
        }

        .status.err {
            color: var(--error);
        }

        /* =========================================
           Theme Toggle — Braun-style pill switch
           ========================================= */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 24px;
            width: 40px;
            height: 20px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: transparent;
            cursor: pointer;
            padding: 0;
            outline: none;
            transition: border-color 0.4s ease;
            display: flex;
            align-items: center;
        }

        .theme-toggle:hover {
            border-color: var(--text-secondary);
        }

        .toggle-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-primary);
            margin-left: 3px;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        background-color 0.35s ease;
        }

        [data-theme="dark"] .toggle-dot {
            transform: translateX(18px);
            background: var(--accent);
        }

        .toggle-label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
        }

        /* Smooth transitions on key elements */
        .thin-line,
        .search-list,
        .location-bar,
        .weather-desc,
        .weather-meta,
        .forecast-name,
        .date-row,
        .time-sec {
            transition: color 0.5s ease, background-color 0.5s ease,
                        border-color 0.5s ease;
        }

        /* =========================================
           Utility
           ========================================= */
        .hide { display: none !important; }

        /* =========================================
           Responsive
           ========================================= */
        @media (max-width: 520px) {
            .clock-face {
                padding: 36px 28px 32px;
                border-radius: 16px;
            }
            .time-hm { font-size: 72px; letter-spacing: -2px; }
            .time-sec { font-size: 26px; }
            .weather-temp { font-size: 42px; }
            .weather-hero { gap: 14px; }
            .forecast { gap: 24px; }
            .forecast-day { min-width: 56px; }
        }

        @media (max-width: 360px) {
            .clock-face { padding: 28px 20px 24px; }
            .time-hm { font-size: 56px; letter-spacing: -1px; }
            .time-sec { font-size: 20px; }
            .weather-temp { font-size: 36px; }
            .forecast { gap: 16px; }
        }
    </style>
</head>
<body>

<div class="clock-face">
    <!-- Theme Toggle -->
    <button class="theme-toggle" id="theme-toggle" type="button">
        <span class="toggle-dot"></span>
        <span class="toggle-label">切换主题</span>
    </button>

    <!-- Time -->
    <div class="time-row">
        <span class="time-hm" id="hm">--<span class="time-colon">:</span>--</span>
        <span class="time-sec" id="sec">:--</span>
    </div>

    <!-- Date -->
    <div class="date-row" id="date">--- · -- · ---</div>

    <!-- Braun Yellow Accent -->
    <div class="accent-line" id="accent"></div>

    <!-- Current Weather -->
    <div class="weather-current" id="current">
        <div class="status">正在获取位置信息…</div>
    </div>

    <!-- Divider -->
    <div class="thin-line" id="midline"></div>

    <!-- Forecast -->
    <div class="forecast hide" id="forecast"></div>

    <!-- Location / Search -->
    <div id="loc-section">
        <div class="location-bar hide" id="loc-bar">
            <span class="loc-dot"></span>
            <span id="loc-name">--</span>
        </div>
        <div class="search-box hide" id="search-box">
            <input type="text" class="search-input" id="search-in"
                   placeholder="搜索城市…" autocomplete="off">
            <div class="search-list hide" id="search-list"></div>
        </div>
    </div>
</div>

<script>
'use strict';

// =============================================
// SVG Weather Icons — Braun-style thin line art
// Viewbox 24×24, stroke-based, no fill
// =============================================
const ICO = (() => {
    const wrap = (inner, size) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" ` +
        `stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

    return {
        sun(s = 44) {
            return wrap(
                `<circle cx="12" cy="12" r="4"/>` +
                `<path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41` +
                `M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>`, s);
        },
        partCloud(s = 44) {
            return wrap(
                `<path d="M12 2v2m6.36 1.64-1.41 1.41M20 12h2M17.66 17.66l1.41 1.41"/>` +
                `<circle cx="12" cy="8" r="4" stroke-dasharray="14 8" stroke-dashoffset="4"/>` +
                `<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>`, s);
        },
        cloud(s = 44) {
            return wrap(
                `<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>`, s);
        },
        drizzle(s = 44) {
            return wrap(
                `<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/>` +
                `<path d="M8 19v1m0-5v1m8 3v1m0-5v1m-4 1v1m0-5v1"/>`, s);
        },
        rain(s = 44) {
            return wrap(
                `<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/>` +
                `<path d="M16 14v6M8 14v6M12 16v6"/>`, s);
        },
        heavyRain(s = 44) {
            return wrap(
                `<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/>` +
                `<path d="M15 13v8M9 13v8M12 15v8"/>`, s);
        },
        snow(s = 44) {
            return wrap(
                `<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/>` +
                `<path d="M8 15h.01M8 19h.01M12 17h.01M12 21h.01M16 15h.01M16 19h.01"/>`, s);
        },
        thunder(s = 44) {
            return wrap(
                `<path d="M6 16.3A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.97"/>` +
                `<path d="m13 12-3 5h4l-3 5"/>`, s);
        },
        fog(s = 44) {
            return wrap(
                `<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/>` +
                `<path d="M16 17H7m10 4H9"/>`, s);
        },

        fromCode(code, size) {
            if (code === 0) return this.sun(size);
            if (code <= 2) return this.partCloud(size);
            if (code === 3) return this.cloud(size);
            if (code <= 48) return this.fog(size);
            if (code <= 57) return this.drizzle(size);
            if (code <= 65) return this.rain(size);
            if (code <= 67) return this.rain(size);
            if (code <= 77) return this.snow(size);
            if (code <= 82) return this.heavyRain(size);
            if (code <= 86) return this.snow(size);
            return this.thunder(size);
        }
    };
})();

// =============================================
// Constants
// =============================================
const WMO = {
    0:'晴',1:'大部晴朗',2:'多云',3:'阴天',
    45:'雾',48:'雾凇',
    51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',56:'冻毛毛雨',57:'冻雨',
    61:'小雨',63:'中雨',65:'大雨',66:'冻小雨',67:'冻大雨',
    71:'小雪',73:'中雪',75:'大雪',77:'霰',
    80:'小阵雨',81:'阵雨',82:'大阵雨',85:'小阵雪',86:'大阵雪',
    95:'雷暴',96:'雷暴冰雹',99:'强雷暴冰雹'
};
const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

// =============================================
// Utility — HTML-escape API data to prevent XSS
// =============================================
function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

// Fetch with timeout (AbortController)
async function safeFetch(url, ms = 12000) {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), ms);
    try {
        const r = await fetch(url, { signal: ctrl.signal });
        clearTimeout(tid);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r;
    } catch (e) {
        clearTimeout(tid);
        throw e;
    }
}

// =============================================
// Theme Controller
// =============================================
const Theme = {
    _key: 'bc_theme',

    init() {
        // Priority: saved preference > system preference > light
        const saved = this._read();
        if (saved) {
            this._apply(saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            this._apply('dark');
        }

        // Toggle button
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            this._apply(next);
            this._save(next);
        });

        // Respond to system preference changes (only if no saved preference)
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!this._read()) this._apply(e.matches ? 'dark' : 'light');
        });
    },

    _apply(mode) {
        if (mode === 'dark') {
            document.documentElement.dataset.theme = 'dark';
        } else {
            delete document.documentElement.dataset.theme;
        }
    },

    _save(mode) {
        try { localStorage.setItem(this._key, mode); } catch {}
    },

    _read() {
        try { return localStorage.getItem(this._key); } catch { return null; }
    }
};

// =============================================
// Clock Module
// =============================================
const Clock = {
    _id: null,
    _blink: false,

    start() {
        this.tick();
        this._id = setInterval(() => this.tick(), 1000);
    },

    tick() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        this._blink = !this._blink;
        const cls = this._blink ? 'time-colon dim' : 'time-colon';

        document.getElementById('hm').innerHTML =
            `${hh}<span class="${cls}">:</span>${mm}`;
        document.getElementById('sec').textContent = `:${ss}`;

        const d = DAYS[now.getDay()];
        const dd = String(now.getDate()).padStart(2, '0');
        const mon = MONS[now.getMonth()];
        document.getElementById('date').textContent = `${d} · ${dd} · ${mon}`;
    }
};

// =============================================
// Weather Service
// =============================================
const WeatherSvc = {
    data: null,
    _timer: null,

    async load(lat, lon) {
        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
            `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m` +
            `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
            `&timezone=auto&forecast_days=4`;
        const r = await safeFetch(url);
        this.data = await r.json();
        return this.data;
    },

    autoRefresh(lat, lon, intervalMs = 30 * 60 * 1000) {
        if (this._timer) clearInterval(this._timer);
        this._timer = setInterval(async () => {
            try {
                await this.load(lat, lon);
                UI.showWeather();
            } catch (e) { console.error('Weather refresh failed:', e); }
        }, intervalMs);
    }
};

// =============================================
// Geocoding
// =============================================
const GeoSearch = {
    async query(name) {
        if (!name || name.length < 2) return [];
        const url = `https://geocoding-api.open-meteo.com/v1/search` +
            `?name=${encodeURIComponent(name)}&count=5&language=zh`;
        try {
            const r = await safeFetch(url, 8000);
            const j = await r.json();
            return j.results || [];
        } catch { return []; }
    }
};

// =============================================
// Location Persistence
// =============================================
const Loc = {
    lat: null, lon: null, name: null,

    restore() {
        try {
            const la = parseFloat(localStorage.getItem('bc_lat'));
            const lo = parseFloat(localStorage.getItem('bc_lon'));
            const nm = localStorage.getItem('bc_city');
            if (isNaN(la) || isNaN(lo)) return false;
            this.lat = la; this.lon = lo; this.name = nm;
            return true;
        } catch { return false; }
    },

    save(lat, lon, name) {
        this.lat = lat; this.lon = lon; this.name = name;
        try {
            localStorage.setItem('bc_lat', lat);
            localStorage.setItem('bc_lon', lon);
            localStorage.setItem('bc_city', name);
        } catch { /* storage unavailable */ }
    },

    async fromBrowser() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) return reject(new Error('不支持定位'));
            navigator.geolocation.getCurrentPosition(
                p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
                reject,
                { timeout: 10000, maximumAge: 300000 }
            );
        });
    }
};

// =============================================
// UI Rendering
// =============================================
const UI = {
    $(id) { return document.getElementById(id); },

    showWeather() {
        const w = WeatherSvc.data;
        if (!w) return;
        const c = w.current;
        const d = w.daily;

        const temp = Math.round(c.temperature_2m);
        const code = c.weather_code;
        const hum = c.relative_humidity_2m;
        const wind = Math.round(c.wind_speed_10m);
        const desc = WMO[code] || '—';

        this.$('current').innerHTML = `
            <div class="weather-hero">
                <div class="weather-icon">${ICO.fromCode(code, 48)}</div>
                <div class="weather-temp">${temp}<span class="weather-unit">°C</span></div>
            </div>
            <div class="weather-desc">${esc(desc)}</div>
            <div class="weather-meta">
                <span>湿度 ${hum}%</span>
                <span>风速 ${wind} km/h</span>
            </div>`;

        // Forecast: days 1–3 (skip today at index 0)
        let fhtml = '';
        for (let i = 1; i <= 3 && i < d.time.length; i++) {
            const dt = new Date(d.time[i] + 'T12:00:00');
            const dn = DAYS[dt.getDay()];
            const fc = d.weather_code[i];
            const hi = Math.round(d.temperature_2m_max[i]);
            const lo = Math.round(d.temperature_2m_min[i]);
            fhtml += `
                <div class="forecast-day">
                    <div class="forecast-name">${dn}</div>
                    <div class="forecast-icon">${ICO.fromCode(fc, 26)}</div>
                    <div class="forecast-temps">
                        <span class="temp-hi">${hi}°</span>
                        <span class="temp-lo">${lo}°</span>
                    </div>
                </div>`;
        }
        const fc = this.$('forecast');
        fc.innerHTML = fhtml;
        fc.classList.remove('hide');

        // Location
        if (Loc.name) {
            this.$('loc-name').textContent = Loc.name;
            this.$('loc-bar').classList.remove('hide');
        }

        this.$('accent').classList.remove('loading');
    },

    loading() {
        this.$('accent').classList.add('loading');
        this.$('current').innerHTML = '<div class="status">正在获取天气数据…</div>';
    },

    promptSearch() {
        this.$('accent').classList.remove('loading');
        this.$('current').innerHTML = '<div class="status">搜索城市以获取天气</div>';
        this.$('search-box').classList.remove('hide');
        this.$('search-in').focus();
    },

    error(msg) {
        this.$('accent').classList.remove('loading');
        this.$('current').innerHTML = `<div class="status err">${esc(msg)}</div>`;
    }
};

// =============================================
// Search Controller
// =============================================
const SearchCtrl = {
    _timer: null,

    init() {
        const input = UI.$('search-in');
        const list = UI.$('search-list');

        input.addEventListener('input', () => {
            clearTimeout(this._timer);
            this._timer = setTimeout(() => this.run(input.value), 350);
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('#search-box')) list.classList.add('hide');
        });

        // Enter key: trigger search immediately
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                clearTimeout(this._timer);
                this.run(input.value);
            }
        });
    },

    async run(q) {
        const list = UI.$('search-list');
        q = (q || '').trim();
        if (q.length < 2) { list.classList.add('hide'); return; }

        const results = await GeoSearch.query(q);
        if (!results.length) {
            list.innerHTML = '<div class="search-item"><span class="search-city">未找到结果</span></div>';
            list.classList.remove('hide');
            return;
        }

        list.innerHTML = results.map(c => {
            const region = [c.admin1, c.country].filter(Boolean).join(', ');
            return `<div class="search-item" data-lat="${c.latitude}" data-lon="${c.longitude}"
                         data-name="${esc(c.name + (region ? ', ' + region : ''))}">
                        <span class="search-city">${esc(c.name)}</span>
                        <span class="search-region">${esc(region)}</span>
                    </div>`;
        }).join('');

        list.querySelectorAll('.search-item[data-lat]').forEach(el => {
            el.addEventListener('click', () => {
                this.pick(
                    parseFloat(el.dataset.lat),
                    parseFloat(el.dataset.lon),
                    el.dataset.name
                );
            });
        });

        list.classList.remove('hide');
    },

    async pick(lat, lon, name) {
        UI.$('search-list').classList.add('hide');
        UI.$('search-box').classList.add('hide');
        Loc.save(lat, lon, name);
        UI.loading();
        try {
            await WeatherSvc.load(lat, lon);
            UI.showWeather();
            WeatherSvc.autoRefresh(lat, lon);
        } catch (e) {
            UI.error('天气获取失败，请稍后重试');
            console.error(e);
        }
    }
};

// =============================================
// App
// =============================================
const App = {
    async init() {
        Theme.init();
        Clock.start();
        SearchCtrl.init();

        // Location bar click → open search
        UI.$('loc-bar').addEventListener('click', () => {
            UI.$('search-box').classList.remove('hide');
            UI.$('search-in').value = '';
            UI.$('search-in').focus();
        });

        // 1. Try saved location
        if (Loc.restore()) {
            UI.loading();
            try {
                await WeatherSvc.load(Loc.lat, Loc.lon);
                UI.showWeather();
                WeatherSvc.autoRefresh(Loc.lat, Loc.lon);
                return;
            } catch { /* fall through */ }
        }

        // 2. Try browser geolocation
        try {
            UI.$('accent').classList.add('loading');
            const pos = await Loc.fromBrowser();
            Loc.save(pos.lat, pos.lon, '当前位置');
            UI.loading();
            await WeatherSvc.load(pos.lat, pos.lon);
            UI.showWeather();
            WeatherSvc.autoRefresh(pos.lat, pos.lon);
        } catch {
            // 3. Fallback: manual search
            UI.promptSearch();
        }
    }
};

App.init();
</script>
